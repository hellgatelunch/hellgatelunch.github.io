name: Refresh menu and publish site

# Three jobs, each with only the access it needs:
#   build    reads the school's page and PDFs (files we don't control). It can't push, can't publish,
#            and keeps no GitHub token, so a booby-trapped file can at most produce bad menu data.
#   save     receives the build's menu files as plain files (never a patch, so nothing can reach
#            .git), refuses anything not on the allow-list, checks every field (menu/accept.mjs,
#            menu/check.mjs, rules in menu/schema.mjs), then commits and packages the site from its
#            own clean copy. Its GitHub token is never written to disk; only the push step sees it.
#   deploy   publishes that package to GitHub Pages.
# Actions are pinned to exact commits so a changed tag upstream can't change what runs here.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (UTC), like the widget
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: menu-and-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm test

      - name: Read the school's menu
        run: node menu/build.mjs

      - name: Hand over the menu files
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- web/data web/calendar.ics)" ]; then echo "No menu changes."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          out="$RUNNER_TEMP/menu-data"
          mkdir -p "$out/data/cells" "$out/data/cells-breakfast"
          cp web/data/menu.json "$out/data/"
          cp web/calendar.ics "$out/"
          for d in cells cells-breakfast; do find "web/data/$d" -maxdepth 1 -type f -name '*.png' -exec cp {} "$out/data/$d/" \; ; done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.diff.outputs.changed == 'true'
        with:
          name: menu-data
          path: ${{ runner.temp }}/menu-data
          retention-days: 3

  save:
    needs: build
    # Scheduled runs only publish when the menu changed; pushes and manual runs always publish.
    if: needs.build.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit new menu data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.build.outputs.changed == 'true'
        with:
          name: menu-data
          path: ${{ runner.temp }}/menu-data

      # Runs with an empty environment: no token, nothing but PATH and HOME.
      - name: Check and take the menu files
        if: needs.build.outputs.changed == 'true'
        run: env -i PATH="$PATH" HOME="$HOME" node menu/accept.mjs "$RUNNER_TEMP/menu-data"

      - name: Save new menu data
        if: needs.build.outputs.changed == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          git add -A web/data web/calendar.ics
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update lunch menu data"
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # If main moved meanwhile (someone pushed), put the menu commit on top and try again.
          for i in 1 2 3; do
            if git push "$remote" HEAD:main; then exit 0; fi
            sleep $((i * 5))
            git pull --rebase "$remote" main
          done
          echo "::error::Couldn't push the menu update"; exit 1

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web

  deploy:
    needs: save
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # GitHub sometimes can't see the just-uploaded site package for a few seconds
      # ("No artifacts named github-pages"), so wait a moment, and retry once if it still fails.
      - name: Let the upload settle
        run: sleep 10

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        continue-on-error: true

      - name: Wait before retrying
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy_retry
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        if: steps.deploy.outcome == 'failure'
